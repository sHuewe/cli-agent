[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-agent"
version = "1.0.0"
description = "General local CLI agent with configurable MCP servers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.9,<2",
    "PyYAML>=6.0",
    "trafilatura>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
cli-agent = "cli_agent.cli:main"
cli-agent-compose-mcp = "cli_agent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/cli_agent/config.example.toml" = "cli_agent/config.example.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
