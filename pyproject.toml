[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-agent"
version = "1.0.0"
description = "General local CLI agent with configurable MCP servers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.9,<2",
    "PyYAML>=6.0",
    "trafilatura>=2.2,<3",
    "cryptography>=50,<51",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<8",
]

[project.scripts]
cli-agent = "cli_agent.cli:main"
cli-agent-compose-mcp = "cli_agent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/cli_agent/config.example.toml" = "cli_agent/config.example.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
