[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cli-agent"
version = "1.0.0"
description = "General local CLI agent with configurable MCP servers"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pypdf>=6.18.1,<7",
    "httpx>=0.27,<1",
    "google-re2>=1.1.20251105,<2",
    "mcp>=1.30,<2",
    "jsonschema>=4.26,<5",
    "PyYAML>=6.0",
    "trafilatura>=2.2,<3",
]

[project.optional-dependencies]
web = [
    "starlette>=1.6,<2",
    "uvicorn>=0.35,<1",
    "websockets>=17,<18",
]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<8",
]

[project.scripts]
cli-agent = "cli_agent.cli:main"
cli-agent-flow = "cli_agent.flow:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/cli_agent/config.example.toml" = "cli_agent/config.example.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
