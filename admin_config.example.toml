# cli-agent machine-wide security policy
# Windows: C:\ProgramData\cli-agent\admin_config.toml
# Linux:   /etc/cli-agent/admin_config.toml

[network]
model_allowed_hosts = ["localhost", "127.0.0.1", "::1"]
mcp_allowed_hosts = ["localhost", "127.0.0.1", "::1"]
web_allowed_hosts = []

# Optional remote model credentials are bound to provider + host. This section
# is only needed when the user config actually sets model.api_key_env.
# [[model.credentials]]
# provider = "openai"
# host = "llm.intern.firma.de"
# allowed_api_key_envs = ["LLM_API_KEY"]

# Every external stdio MCP must be defined here individually. A project/user
# config may only reference such a server by name; command, args and env come
# exclusively from this machine-wide policy. The agent resolves managed
# placeholders such as {workspace_directory} itself at launch time.
#
# [[mcp.trusted_servers]]
# name = "local-audited-tool"
# transport = "stdio"
# command = "C:/Program Files/Company/audited-mcp.exe"
# args = ["--project-directory", "{workspace_directory}", "--stdio"]
# trust_instructions = false
#
# For stdio, commands must be absolute executables. The special {python}
# placeholder is also accepted because it resolves to sys.executable of the
# managed cli-agent installation. Bare PATH commands are rejected.
#
# Streamable HTTP MCPs normally need no [[mcp.trusted_servers]] entry: their
# host only needs to be present in network.mcp_allowed_hosts. Add a trusted
# server entry for HTTP only when server instructions should be elevated into
# the system prompt or when pinned permanent tool auto-approvals are required.
# Untrusted MCP instructions remain available to the model as transient,
# explicitly untrusted reference context.
#
# [[mcp.trusted_servers]]
# name = "fachsoftware"
# transport = "streamable_http"
# url = "https://mcp.intern.firma.de/mcp"
# trust_instructions = true
#
# Persistent auto-approvals pin the complete model-visible MCP tool contract.
# Do not calculate contract_sha256 manually. Use:
#
#   cli-agent admin inspect-tool fachsoftware search --config config.toml
#   cli-agent admin trust-tool fachsoftware search --config config.toml
#
# The second command prints a TOML fragment. It NEVER modifies this file. Review
# the displayed description and schema and copy the generated fragment manually
# into the matching [[mcp.trusted_servers]] entry.
#
# [[mcp.trusted_servers.auto_approve_tools]]
# name = "search"
# contract_sha256 = "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
