# cli-agent machine-wide security policy
#
# Windows: C:\ProgramData\cli-agent\admin_config.toml
# Linux:   /etc/cli-agent/admin_config.toml
#
# This file is intentionally separate from the user/project config. Network
# allowlists and MCP trust/approval decisions are administrator policy and
# cannot be overridden from config.toml.

[network]
model_allowed_hosts = ["localhost", "127.0.0.1", "::1"]
mcp_allowed_hosts = ["localhost", "127.0.0.1", "::1"]
web_allowed_hosts = []

[mcp]
allow_untrusted_stdio = false

# Persistent MCP auto-approvals are bound to a concrete administrator-defined
# server identity. The user-configured MCP must match name, transport and the
# complete endpoint identity before one of these tools can run without approval.
#
# Example HTTP MCP:
# [[mcp.trusted_servers]]
# name = "continuous"
# transport = "streamable_http"
# url = "https://mcp.intern.firma.de/mcp"
# auto_approve_tools = ["search"]
#
# Example stdio MCP:
# [[mcp.trusted_servers]]
# name = "local-audited-tool"
# transport = "stdio"
# command = "C:/Program Files/Company/audited-mcp.exe"
# args = ["--stdio"]
# auto_approve_tools = ["search"]
