# cli-agent configuration template
#
# This file is used as the initial default configuration. No MCP server and no
# OKF repository are enabled by default. Enable only the capabilities that are
# required for a specific use case.

dump_llm_context = false

[logging]
enabled = true
level = "INFO"
log_prompts = false
log_tool_calls = false
log_model_messages = false
log_tool_results = false
max_bytes = 5000000
backup_count = 3

[model]
provider = "ollama"
model = "qwen3.5:9b"
base_url = "http://localhost:11434"
timeout = 120
# Optional hard guard based on provider-reported input-token usage.
# context_length = 24576

[network]
model_allowed_hosts = ["localhost", "127.0.0.1", "::1"]
mcp_allowed_hosts = ["localhost", "127.0.0.1", "::1"]
web_allowed_hosts = []

# OpenAI-compatible model endpoint:
# [model]
# provider = "openai"
# model = "NAME-DES-MODELLS"
# base_url = "https://llm.example.org/v1"
# api_key_env = "LLM_API_KEY"
# timeout = 120
# context_length = 262144

