# cli-agent configuration template
#
# This is the user/project configuration. Security policy is intentionally kept
# separate in the machine-wide admin_config.toml. In particular, [network] is
# not valid here and cannot override administrator allowlists.

dump_llm_context = false

[logging]
enabled = true
level = "INFO"
# Optional relative path below the cli-agent state directory. Absolute paths and
# '..' are rejected so a project config cannot redirect log rotation elsewhere.
# file = "logs/cli-agent.log"
log_prompts = false
log_tool_calls = false
log_model_messages = false
log_tool_results = false
max_bytes = 5000000
backup_count = 3

[model]
provider = "ollama"
model = "qwen3.5:9b"
base_url = "http://localhost:11434"
timeout = 120
# context_length = 24576

# OpenAI-compatible model endpoint:
# [model]
# provider = "openai"
# model = "NAME-DES-MODELLS"
# base_url = "https://llm.example.org/v1"
# api_key_env = "LLM_API_KEY"
# timeout = 120
# context_length = 262144

# -----------------------------------------------------------------------------
# Optional MCP servers
# -----------------------------------------------------------------------------

# Built-in workspace OS MCP is enabled with --with-os-read or --with-os-write.
# It is not configured as an external stdio server here.

# External stdio MCP: user/project configuration selects only the administrative
# server profile by name. command, args and env must be defined in the matching
# [[mcp.trusted_servers]] entry of admin_config.toml.
# [[mcp_servers]]
# name = "local-audited-tool"

# External Streamable HTTP MCP. Its host must be permitted by admin_config.toml.
# A trusted-server entry is NOT normally required; it is only needed for
# permanent auto-approvals or explicitly trusted server instructions.
# [[mcp_servers]]
# name = "external"
# transport = "streamable_http"
# url = "http://127.0.0.1:8001/mcp"
#
# [mcp_servers.headers]
# Authorization = "Bearer example-token"

# -----------------------------------------------------------------------------
# Optional OKF knowledge repository
# -----------------------------------------------------------------------------
# [okf]
# repository = "C:/dev/knowledge/okf/bundle"
# max_tool_calls = 200
# max_read_bytes = 2560000
# compress_min_chars = 20000
# required = true
