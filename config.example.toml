# cli-agent configuration template
#
# No MCP server and no OKF repository are enabled by default.

dump_llm_context = false

[logging]
enabled = true
level = "INFO"
log_prompts = false
log_tool_calls = false
log_model_messages = false
log_tool_results = false
max_bytes = 5000000
backup_count = 3

[model]
provider = "ollama"
model = "qwen3.5:9b"
base_url = "http://localhost:11434"
timeout = 120
# context_length = 24576

[network]
model_allowed_hosts = ["localhost", "127.0.0.1", "::1"]
mcp_allowed_hosts = ["localhost", "127.0.0.1", "::1"]
web_allowed_hosts = []

