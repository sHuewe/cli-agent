[logging]
enabled = true
level = "INFO"
log_prompts = true
log_model_messages = true
log_tool_results = true
max_bytes = 5000000
backup_count = 3

[model]
provider = "ollama"
model = "qwen3.5:9b"
base_url = "http://localhost:11434"
timeout = 120

#[model]
#provider = "openai"
#model = "NAME-DES-FIRMENMODELLS"
#base_url = "https://llm.firma.de/v1"
#api_key_env = "FIRMA_LLM_API_KEY"
#timeout = 120

# The agent is general-purpose. It only receives tools from the MCP servers
# listed here. Both placeholders are resolved by cli-agent.
[[mcp_servers]]
name = "compose"
transport = "stdio"
command = "{python}"
args = [
    "-m",
    "cli_agent.mcp_server",
    "--project-directory",
    "{workspace_directory}",
    "--config-file",
    "{config_file}",
]
compress_result = true
compress_min_chars = 8000
[mcp_servers.config]
wsl2 = true 

[[mcp_servers]]
name = "python-validator"
transport = "stdio"
command = "{python}"
args = [
    "-m",
    "cli_agent.python_validator_mcp",
    "--project-directory",
    "{workspace_directory}",
    "--python-image",
    "python:3.12-slim",
]
