# cli-agent configuration template
#
# This is the user/project configuration. Security policy is intentionally kept
# separate in the machine-wide admin_config.toml. In particular, [network] is
# not valid here and cannot override administrator allowlists.

dump_llm_context = false

[logging]
enabled = true
level = "INFO"
log_prompts = false
log_tool_calls = false
log_model_messages = false
log_tool_results = false
max_bytes = 5000000
backup_count = 3

[model]
provider = "ollama"
model = "qwen3.5:9b"
base_url = "http://localhost:11434"
timeout = 120
# context_length = 24576

# OpenAI-compatible model endpoint:
# [model]
# provider = "openai"
# model = "NAME-DES-MODELLS"
# base_url = "https://llm.example.org/v1"
# api_key_env = "LLM_API_KEY"
# Authentication secrets must not be placed in [model.headers]. Static
# Authorization headers are rejected; use api_key_env for model credentials.
# timeout = 120
# context_length = 262144

# -----------------------------------------------------------------------------
# Optional MCP servers
# -----------------------------------------------------------------------------

# Built-in workspace OS MCP is enabled with --with-os-read or --with-os-write.

# External stdio MCP: select only an administrative server profile by name.
# command, args and env are defined exclusively in admin_config.toml.
# [[mcp_servers]]
# name = "local-audited-tool"

# External Streamable HTTP MCP. Its host must be permitted by admin_config.toml.
# Unauthenticated HTTP MCPs need no trusted-server entry unless permanent
# auto-approvals or explicitly trusted server instructions are required.
# Bearer authentication is configured only in admin_config.toml via
# [mcp.trusted_servers.from_env.authentication]; static Authorization headers
# are intentionally rejected here.
# [[mcp_servers]]
# name = "external"
# transport = "streamable_http"
# url = "http://127.0.0.1:8001/mcp"
#
# [mcp_servers.headers]
# X-Workspace = "{workspace_directory}"
#
# HTTP MCP URLs/headers may use {workspace_directory} or {project_directory}
# when the server needs an explicit workspace binding. {python} and {config_file}
# are intentionally restricted to administratively controlled stdio profiles.

# -----------------------------------------------------------------------------
# Optional OKF knowledge repository
# -----------------------------------------------------------------------------
# repository is a user-selected read-only knowledge root. It may intentionally
# be outside the project workspace and is currently not restricted by an
# admin-side OKF root allowlist. In managed deployments, use only centrally
# reviewed/configured knowledge repositories whose contents may be sent to the
# configured LLM. A normal folder is not exposed as generic Markdown: the OKF
# server requires valid OKF concepts and ignores non-OKF Markdown content.
# [okf]
# repository = "C:/dev/knowledge/okf/bundle"
# max_tool_calls = 200
# max_read_bytes = 2560000
# compress_min_chars = 20000
# required = true
