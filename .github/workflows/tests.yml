name: Tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        python-version:
          - "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        run: python -m pip install uv==0.12.13

      - name: Refresh lockfile
        run: uv lock

      - name: Commit refreshed lockfile on branch push
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/security-hardening-review'
        shell: bash
        run: |
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "Refresh dependency lockfile"
            git push origin HEAD:security-hardening-review
          fi

      - name: Sync locked project and test dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests with coverage from locked environment
        run: >-
          uv run --frozen python -m pytest
          --cov=cli_agent
          --cov-report=term-missing
