name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        python-version:
          - "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        run: python -m pip install uv==0.12.13

      - name: Verify lockfile is current
        shell: bash
        run: |
          uv lock
          git diff --exit-code -- uv.lock

      - name: Sync locked project and test dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests with coverage from locked environment
        run: >-
          uv run --frozen python -m pytest
          --cov=cli_agent
          --cov-report=term-missing
