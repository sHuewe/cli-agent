name: Apply flow global retry patch

on:
  push:
    branches:
      - feature/flow-global-retry

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary global retry patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch implementation, tests and docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          flow_path = Path('src/cli_agent/flow.py')
          text = flow_path.read_text(encoding='utf-8')

          old = '    allowed_root = {"version", "steps", "exclude_paths", "vars"}\n'
          new = '    allowed_root = {"version", "steps", "exclude_paths", "vars", "retry"}\n'
          if text.count(old) != 1:
              raise SystemExit('expected allowed_root anchor exactly once')
          text = text.replace(old, new, 1)

          anchor = '''    if values.get("version") != 1:\n        raise ValueError("Flow-Datei benötigt version = 1.")\n\n    raw_global_vars = values.get("vars", {})\n'''
          replacement = '''    if values.get("version") != 1:\n        raise ValueError("Flow-Datei benötigt version = 1.")\n\n    allowed_retry = {\n        "max_attempts",\n        "initial_delay_seconds",\n        "backoff_multiplier",\n        "max_delay_seconds",\n    }\n    raw_global_retry = values.get("retry")\n    global_retry_policy: ModelRetryPolicy | None = None\n    if raw_global_retry is not None:\n        if not isinstance(raw_global_retry, dict):\n            raise ValueError("retry muss eine Tabelle sein.")\n        unknown_retry = set(raw_global_retry) - allowed_retry\n        if unknown_retry:\n            raise ValueError(\n                "retry enthält unbekannte Schlüssel: "\n                + ", ".join(sorted(unknown_retry))\n            )\n        global_retry_policy = ModelRetryPolicy(\n            max_attempts=raw_global_retry.get("max_attempts", 1),\n            initial_delay_seconds=raw_global_retry.get(\n                "initial_delay_seconds",\n                1.0,\n            ),\n            backoff_multiplier=raw_global_retry.get(\n                "backoff_multiplier",\n                2.0,\n            ),\n            max_delay_seconds=raw_global_retry.get(\n                "max_delay_seconds",\n                10.0,\n            ),\n        )\n\n    raw_global_vars = values.get("vars", {})\n'''
          if text.count(anchor) != 1:
              raise SystemExit('expected global retry insertion anchor exactly once')
          text = text.replace(anchor, replacement, 1)

          old_retry = '''        raw_retry = raw.get("retry")\n        retry_policy: ModelRetryPolicy | None = None\n        if raw_retry is not None:\n            if not isinstance(raw_retry, dict):\n                raise ValueError(\n                    f"steps[{index}].retry muss eine Tabelle sein."\n                )\n            allowed_retry = {\n                "max_attempts",\n                "initial_delay_seconds",\n                "backoff_multiplier",\n                "max_delay_seconds",\n            }\n            unknown_retry = set(raw_retry) - allowed_retry\n            if unknown_retry:\n                raise ValueError(\n                    f"steps[{index}].retry enthält unbekannte Schlüssel: "\n                    + ", ".join(sorted(unknown_retry))\n                )\n            retry_policy = ModelRetryPolicy(\n                max_attempts=raw_retry.get("max_attempts", 1),\n                initial_delay_seconds=raw_retry.get(\n                    "initial_delay_seconds",\n                    1.0,\n                ),\n                backoff_multiplier=raw_retry.get(\n                    "backoff_multiplier",\n                    2.0,\n                ),\n                max_delay_seconds=raw_retry.get(\n                    "max_delay_seconds",\n                    10.0,\n                ),\n            )\n'''
          new_retry = '''        raw_retry = raw.get("retry")\n        retry_policy = global_retry_policy\n        if raw_retry is not None:\n            if not isinstance(raw_retry, dict):\n                raise ValueError(\n                    f"steps[{index}].retry muss eine Tabelle sein."\n                )\n            unknown_retry = set(raw_retry) - allowed_retry\n            if unknown_retry:\n                raise ValueError(\n                    f"steps[{index}].retry enthält unbekannte Schlüssel: "\n                    + ", ".join(sorted(unknown_retry))\n                )\n            inherited_retry = global_retry_policy or ModelRetryPolicy()\n            retry_policy = ModelRetryPolicy(\n                max_attempts=raw_retry.get(\n                    "max_attempts",\n                    inherited_retry.max_attempts,\n                ),\n                initial_delay_seconds=raw_retry.get(\n                    "initial_delay_seconds",\n                    inherited_retry.initial_delay_seconds,\n                ),\n                backoff_multiplier=raw_retry.get(\n                    "backoff_multiplier",\n                    inherited_retry.backoff_multiplier,\n                ),\n                max_delay_seconds=raw_retry.get(\n                    "max_delay_seconds",\n                    inherited_retry.max_delay_seconds,\n                ),\n            )\n'''
          if text.count(old_retry) != 1:
              raise SystemExit('expected step retry block exactly once')
          text = text.replace(old_retry, new_retry, 1)
          flow_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_flow_global_retry.py')
          tests = test_path.read_text(encoding='utf-8')
          insert_before = '''\ndef test_no_retry_configuration_stays_disabled(tmp_path: Path) -> None:\n'''
          addition = '''\ndef test_partial_global_retry_uses_existing_defaults(tmp_path: Path) -> None:\n    _write_prompt(tmp_path)\n    (tmp_path / "flow.toml").write_text(\n        """\nversion = 1\n\n[retry]\nmax_attempts = 2\n\n[[steps]]\nid = "one"\nprompt_file = "prompt.md"\n""".strip(),\n        encoding="utf-8",\n    )\n\n    flow = load_flow(tmp_path / "flow.toml", workspace=tmp_path)\n    retry = flow.steps[0].retry_policy\n\n    assert retry is not None\n    assert retry.max_attempts == 2\n    assert retry.initial_delay_seconds == 1.0\n    assert retry.backoff_multiplier == 2.0\n    assert retry.max_delay_seconds == 10.0\n\n\n'''
          if tests.count(insert_before) != 1:
              raise SystemExit('expected retry test insertion anchor exactly once')
          tests = tests.replace(insert_before, '\n' + addition + 'def test_no_retry_configuration_stays_disabled(tmp_path: Path) -> None:\n', 1)
          test_path.write_text(tests, encoding='utf-8')

          docs_path = Path('docs/flow.md')
          docs = docs_path.read_text(encoding='utf-8')
          old_example = '''version = 1\n\n[[steps]]\nid = "discover"\n'''
          new_example = '''version = 1\n\n[retry]\nmax_attempts = 3\ninitial_delay_seconds = 1\nbackoff_multiplier = 2\nmax_delay_seconds = 10\n\n[[steps]]\nid = "discover"\n'''
          if docs.count(old_example) < 1:
              raise SystemExit('expected docs version example anchor')
          docs = docs.replace(old_example, new_example, 1)
          old_step_retry_example = '''\n[steps.retry]\nmax_attempts = 3\ninitial_delay_seconds = 1\nbackoff_multiplier = 2\nmax_delay_seconds = 10\n\n[[steps]]\nid = "process"\n'''
          new_step_retry_example = '''\n[[steps]]\nid = "process"\n'''
          if docs.count(old_step_retry_example) != 1:
              raise SystemExit('expected docs step retry example exactly once')
          docs = docs.replace(old_step_retry_example, new_step_retry_example, 1)
          old_docs_retry = '''Die optionale Tabelle `[steps.retry]` steuert ausschließlich Wiederholungen\ntransient fehlgeschlagener **Modellanfragen** innerhalb dieses Schritts. Sie\nwiederholt niemals einen vollständigen Step und führt daher bereits ausgeführte\nMCP-Tool-Aufrufe nicht erneut aus. `max_attempts` zählt den ersten Versuch mit;\n`max_attempts = 1` deaktiviert Retries. Wiederholt werden derzeit\nVerbindungs-/Transportfehler sowie HTTP 429 und HTTP 5xx von OpenAI-kompatiblen\nbzw. Ollama-Endpunkten. Konfigurations-, Authentifizierungs-/4xx-Fehler (außer\n429), Context-Limits, zu große Antworten und ungültige Modellantworten werden\nnicht automatisch erneut versucht.\n'''
          new_docs_retry = '''Die optionale globale Tabelle `[retry]` definiert die Retry-Policy für alle\nSteps des Flows. Ein Step kann mit `[steps.retry]` einzelne Werte überschreiben;\nnicht gesetzte Step-Werte werden aus der globalen Policy geerbt. Gibt es keine\nglobale Policy, behalten step-spezifische Teilangaben die bisherigen Defaults\n(`max_attempts = 1`, `initial_delay_seconds = 1`, `backoff_multiplier = 2`,\n`max_delay_seconds = 10`). Wenn weder `[retry]` noch `[steps.retry]` gesetzt ist,\nsind Retries weiterhin deaktiviert.\n\nDie Retry-Policy steuert ausschließlich Wiederholungen transient fehlgeschlagener\n**Modellanfragen**. Sie wiederholt niemals einen vollständigen Step und führt\ndaher bereits ausgeführte MCP-Tool-Aufrufe nicht erneut aus. `max_attempts` zählt\nden ersten Versuch mit; `max_attempts = 1` deaktiviert Retries. Wiederholt werden\nderzeit Verbindungs-/Transportfehler sowie HTTP 429 und HTTP 5xx von\nOpenAI-kompatiblen bzw. Ollama-Endpunkten. Konfigurations-,\nAuthentifizierungs-/4xx-Fehler (außer 429), Context-Limits, zu große Antworten\nund ungültige Modellantworten werden nicht automatisch erneut versucht.\n'''
          if docs.count(old_docs_retry) != 1:
              raise SystemExit('expected docs retry paragraph exactly once')
          docs = docs.replace(old_docs_retry, new_docs_retry, 1)
          docs_path.write_text(docs, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_readme_note = '`[steps.retry]` kann pro Schritt bounded Retries für transient fehlgeschlagene Modellrequests konfigurieren (z. B. Verbindungsfehler, HTTP 429/5xx). Dabei wird nur der konkrete Modellrequest wiederholt, nicht der gesamte Step oder bereits ausgeführte Tool-Aufrufe.'
          new_readme_note = '`[retry]` kann eine globale bounded Retry-Policy für alle Flow-Schritte definieren. `[steps.retry]` überschreibt bei Bedarf einzelne Werte pro Step und erbt nicht gesetzte Werte aus der globalen Policy. Wiederholt wird nur der konkrete transient fehlgeschlagene Modellrequest (z. B. Verbindungsfehler, HTTP 429/5xx), nicht der gesamte Step oder bereits ausgeführte Tool-Aufrufe.'
          if readme.count(old_readme_note) != 1:
              raise SystemExit('expected README retry note exactly once')
          readme = readme.replace(old_readme_note, new_readme_note, 1)
          readme_path.write_text(readme, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        shell: bash
        run: rm .github/workflows/apply-flow-global-retry.yml
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/cli_agent/flow.py tests/test_flow_global_retry.py docs/flow.md README.md .github/workflows/apply-flow-global-retry.yml
          git commit -m "Implement global flow retry policy"
          git push origin HEAD:feature/flow-global-retry
