name: Temporary regenerate rag extra lock
on:
  push:
    branches:
      - feature/chroma-agent-knowledge
    paths:
      - pyproject.toml
      - .github/workflows/update-rag-lock-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/chroma-agent-knowledge
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned uv
        run: python -m pip install uv==0.12.13
      - name: Regenerate lockfile and verify
        run: |
          uv lock
          uv lock --check
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock already current"
          else
            git commit -m "chore(lock): resolve optional ChromaDB rag extra"
            git push origin HEAD:feature/chroma-agent-knowledge
          fi
